<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TuneTap</title>
  <meta name="description" content="Beautiful NFC cards that play your Spotify playlists with a tap. Keep them, collect them, or give one as a gift.">
  <meta name="theme-color" content="#fbfaf8">
  <meta name="color-scheme" content="light">
  <style>
    :root {
      --bg: #fbfaf8; --bg2: #f1ede6; --ink: #1a1722; --muted: #7a7385;
      --accent: #1db954; --accent-deep: #0f9d58; --accent-ink: #04120a;
      --line: rgba(26,23,34,0.10); --line-soft: rgba(26,23,34,0.06);
      --panel: #ffffff;
      --lift: 0 1px 0 rgba(255,255,255,0.7) inset, 0 10px 24px -14px rgba(26,23,34,0.22);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100dvh; color: var(--ink); line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background:
        radial-gradient(90% 55% at 50% -8%, rgba(29,185,84,0.10), transparent 62%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      background-attachment: fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: max(40px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom));
    }
    #box-landing-frame { margin: -40px -22px 26px; width: calc(100% + 44px); max-width: none; }
    main { width: 100%; max-width: 420px; text-align: center; }

    .brand {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 700;
      font-size: 15px; letter-spacing: -0.01em; color: var(--ink);
      padding: 7px 14px 7px 8px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); box-shadow: var(--lift);
    }
    .brand .dot {
      width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
      font-size: 12px; background: linear-gradient(150deg, var(--accent), var(--accent-deep));
    }
    .brand .tap { color: var(--accent); }

    /* ---- 3D product card ---- */
    .stage { perspective: 1300px; margin: 34px 0 6px; height: 236px; position: relative; }
    .pcard {
      position: absolute; left: 50%; top: 50%; width: 290px; aspect-ratio: 1.586;
      border-radius: 20px; transform-style: preserve-3d;
      border: 1px solid var(--line); box-shadow: 0 30px 50px -26px rgba(26,23,34,0.5);
    }
    .pcard.back {
      background: linear-gradient(150deg, #eef4ef, #e3ece6);
      transform: translate(-58%, -46%) rotateX(8deg) rotateY(-18deg) rotate(-9deg);
      filter: saturate(0.9); opacity: 0.85;
    }
    .pcard.front {
      background:
        radial-gradient(120% 100% at 0% 0%, rgba(29,185,84,0.12), transparent 55%),
        linear-gradient(150deg, #ffffff, #f4f1ea);
      transform: translate(-46%, -52%) rotateX(7deg) rotateY(-15deg) rotate(2deg);
      padding: 16px 18px; text-align: left; display: flex; flex-direction: column;
      transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
    }
    .stage:hover .pcard.front { transform: translate(-46%, -52%) rotateX(3deg) rotateY(-6deg) rotate(1deg); }
    @media (prefers-reduced-motion: reduce) { .pcard.front { transition: none; } }
    .pcard .row { display: flex; align-items: center; justify-content: space-between; }
    .pcard .name { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
    .pcard .nfc { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; }
    .pcard .plabel { margin-top: auto; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .pcard .sublabel { font-size: 11px; color: var(--muted); }
    .wave { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin: 10px 0 12px; }
    .wave i { width: 4px; border-radius: 3px; background: linear-gradient(var(--accent), var(--accent-deep)); }

    h1 { font-size: 30px; margin: 26px 0 0; letter-spacing: -0.03em; font-weight: 700; }
    h1 .tap { color: var(--accent); }
    .lead { font-size: 16px; color: var(--muted); margin: 12px auto 0; max-width: 340px; }

    .cta { margin-top: 26px; display: grid; gap: 11px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-decoration: none; padding: 15px 22px; border-radius: 16px;
      font-weight: 600; font-size: 16px; letter-spacing: -0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn.shop {
      background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: var(--accent-ink);
      box-shadow: 0 12px 26px -12px rgba(29,185,84,0.65);
    }
    .btn.shop:hover { transform: translateY(-2px); }
    .btn.shop:active { transform: translateY(0); }

    .getapp { margin-top: 22px; }
    .getapp .label { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
    .stores { display: grid; gap: 10px; }
    .store {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      text-decoration: none; padding: 12px 18px; border-radius: 15px;
      background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      box-shadow: var(--lift); transition: transform 0.15s ease;
    }
    .store:hover { transform: translateY(-2px); }
    .store svg { width: 24px; height: 24px; flex: 0 0 auto; }
    .store .txt { text-align: left; line-height: 1.15; }
    .store .txt small { display: block; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .store .txt strong { display: block; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

    .feats { margin: 30px 0 0; display: grid; gap: 12px; }
    .feat {
      display: flex; gap: 13px; align-items: center; text-align: left;
      padding: 15px 16px; border-radius: 16px; background: var(--panel);
      border: 1px solid var(--line-soft); box-shadow: var(--lift);
    }
    .feat .ic {
      flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      font-size: 19px; background: color-mix(in srgb, var(--accent) 12%, #fff); border: 1px solid var(--line-soft);
    }
    .feat b { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .feat span { font-size: 13.5px; color: var(--muted); }

    footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <!-- "The Box" waitlist page, stacked above the TuneTap landing content.
       Loaded in an iframe (its own document) so its styles/fonts/layout
       can't collide with the TuneTap CSS below. -->
  <iframe
    id="box-landing-frame"
    src="the-box-landing.html"
    title="The Box — waitlist"
    style="display:block; width:100%; border:0; height:600px;"
    loading="lazy"
    onload="try{this.style.height=(this.contentWindow.document.body.scrollHeight+1)+'px';}catch(e){}"
  ></iframe>
</body>
</html>
