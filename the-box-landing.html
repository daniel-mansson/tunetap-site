<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Box — A Nordic, screen-free story player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE4;
    --paper: #FBF8F1;
    --sage: #7C8B6E;
    --sage-dark: #5C6A50;
    --ink: #2B2620;
    --ink-soft: #5C5548;
    --line: #DED5C1;
    --terracotta: #B5764F;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
  }
  h1, h2, h3, .display{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  a{ color: inherit; }
  .wrap{ max-width: 1160px; margin: 0 auto; padding: 0 32px; }

  /* Header */
  header{
    position: sticky; top:0; z-index: 20;
    background: rgba(243,238,228,0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 18px; padding-bottom: 18px;
  }
  .brand{
    font-family:'Fraunces', serif; font-size: 20px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background: var(--sage); display:inline-block; }
  .nav-cta{
    background: var(--ink); color: var(--paper);
    border:none; padding: 11px 22px; border-radius: 100px;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    cursor:pointer; transition: transform .15s ease, background .15s ease;
  }
  .nav-cta:hover{ background: var(--sage-dark); transform: translateY(-1px); }

  /* Hero */
  .hero{ padding: 88px 0 40px; }
  .hero-grid{
    display:grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items:center;
  }
  .hero-solo{
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .hero-solo .hero-img-wrap{ max-width: 640px; width:100%; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    color: var(--sage-dark); font-weight:600; margin-bottom:22px;
  }
  .hero-solo .eyebrow{ justify-content:center; }
  .eyebrow::before, .eyebrow::after{ content:""; width:20px; height:1px; background:var(--sage-dark); }
  .hero h1{
    font-size: clamp(38px, 4.6vw, 58px);
    line-height: 1.06;
    margin: 0 0 22px;
  }
  .hero p.sub{
    font-size: 18px; color: var(--ink-soft); max-width: 480px; margin: 0 0 34px;
  }
  .hero-img-wrap{
    border-radius: 22px; overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(43,38,32,0.28);
    border: 1px solid var(--line);
  }
  .hero-img-wrap img{ display:block; width:100%; height:auto; }

  /* Waitlist form */
  .waitlist-form{
    display:flex; gap:10px; max-width: 460px; margin-bottom: 14px;
  }
  .waitlist-form input[type="email"]{
    flex:1; padding: 15px 18px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--paper);
    font-family:'Inter',sans-serif; font-size:15px; color: var(--ink);
    outline:none; transition: border-color .15s ease;
  }
  .waitlist-form input[type="email"]:focus{ border-color: var(--sage); }
  .waitlist-form button{
    background: var(--sage-dark); color:#fff; border:none;
    padding: 0 26px; border-radius: 100px; font-family:'Inter',sans-serif;
    font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition: background .15s ease, transform .15s ease;
  }
  .waitlist-form button:hover{ background:#4c5841; transform: translateY(-1px); }
  .micro{ font-size:13px; color: var(--ink-soft); }
  .form-msg{ font-size:14px; margin-top:10px; min-height: 20px; }
  .form-msg.success{ color: var(--sage-dark); font-weight:600; }

  @media (max-width: 720px){
    .waitlist-form{ flex-direction:column; }
    .waitlist-form button{ padding:14px; }
  }

  /* Value props */
  .values{ padding: 96px 0; border-top:1px solid var(--line); }
  .section-head{ max-width: 560px; margin-bottom: 56px; }
  .section-head .eyebrow{ margin-bottom: 16px; }
  .section-head h2{ font-size: clamp(28px, 3vw, 36px); margin:0 0 14px; }
  .section-head p{ color: var(--ink-soft); font-size:16px; margin:0; }

  .value-grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 36px;
  }
  .value-card{
    background: var(--paper); border:1px solid var(--line); border-radius:18px;
    padding: 32px 28px;
  }
  .value-card .num{
    font-family:'Fraunces', serif; font-size:14px; color: var(--terracotta);
    font-weight:600; margin-bottom:18px;
  }
  .value-card h3{ font-size:20px; margin: 0 0 10px; }
  .value-card p{ font-size:15px; color: var(--ink-soft); margin:0; }

  @media (max-width: 860px){
    .hero-grid{ grid-template-columns:1fr; }
    .hero{ padding-top:56px; }
    .value-grid{ grid-template-columns:1fr; }
  }

  /* Final CTA */
  .final-cta{
    background: var(--sage-dark); color:#fff; border-radius: 28px;
    margin: 0 0 96px; padding: 72px 48px; text-align:center;
  }
  .final-cta h2{ color:#fff; font-size: clamp(28px,3.4vw,40px); margin:0 0 16px; }
  .final-cta p{ color: #E4E6DC; font-size:16px; margin: 0 auto 34px; max-width:480px; }
  .final-cta .waitlist-form{ margin: 0 auto 14px; }
  .final-cta .waitlist-form input[type="email"]{ border:none; }
  .final-cta .waitlist-form button{ background:#fff; color: var(--sage-dark); }
  .final-cta .waitlist-form button:hover{ background:#F0EEE4; }
  .final-cta .micro{ color:#CFD3C4; }

  footer{
    border-top:1px solid var(--line); padding: 32px 0 48px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color: var(--ink-soft);
  }
  footer .brand{ font-size:15px; }
</style>
</head>
<body>

  <header>
    <div class="wrap nav">
      <div class="brand">The Box</div>
      <button class="nav-cta" onclick="document.getElementById('waitlist').scrollIntoView({behavior:'smooth'})">Join the waitlist</button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap hero-solo">
      <div class="eyebrow">Coming soon</div>
      <div class="hero-img-wrap">
        <img src="assets/hero-product.png" alt="The Box, a sage-green screen-free story player, beside a tray of illustrated story cards including Madicken, Ronja Rövardotter and Bröderna Lejonhjärta">
      </div>
    </div>
  </section>

  <section class="wrap" id="waitlist">
    <div class="final-cta">
      <h2>Be first to know when it launches.</h2>
      <p>Join the waitlist and we'll notify you the moment early units are available to order.</p>
      <form class="waitlist-form" onsubmit="handleWaitlistSubmit(event, 'final-msg')">
        <input type="email" required placeholder="your@email.com" aria-label="Email address">
        <button type="submit">Notify me</button>
      </form>
      <div class="form-msg" id="final-msg"></div>
      <p class="micro">One email, at launch. Nothing before that.</p>
    </div>
    <p class="micro" style="text-align:center; margin: 24px 0 48px;">For questions or partnerships, contact: <a href="mailto:hello@tunetap.to">hello@tunetap.to</a></p>
  </section>

<script>
  // NOTE: This form is front-end only. To actually collect signups, wire the
  // fetch() call below to an email service endpoint — e.g. a Mailchimp
  // audience signup URL, a Formspree/ConvertKit form endpoint, or a Google
  // Sheets webhook. Until that's connected, this only shows a local
  // confirmation message and does not store the email anywhere.
  function handleWaitlistSubmit(e, msgId){
    e.preventDefault();
    const form = e.target;
    const email = form.querySelector('input[type="email"]').value;
    const msg = document.getElementById(msgId);

    // --- Replace this block with a real submission, e.g.: ---
    // fetch('YOUR_ENDPOINT_URL', {
    //   method: 'POST',
    //   headers: {'Content-Type':'application/json'},
    //   body: JSON.stringify({ email })
    // });

    msg.textContent = "You're on the list — we'll email " + email + " at launch.";
    msg.classList.add('success');
    form.reset();
  }
</script>

</body>
</html>
