<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Box — A screen-free audio player | Coming soon</title>
<meta name="description" content="The Box is a sage-green, screen-free audio player with illustrated cards. Join the waitlist to be notified when early units are available.">
<meta property="og:title" content="The Box — A screen-free audio player">
<meta property="og:description" content="A sage-green, screen-free audio player with illustrated cards. Join the waitlist for launch.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fira+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --radius: 0.25rem;
    --font-display: "DM Serif Display", Georgia, serif;
    --font-sans: "Fira Sans", system-ui, sans-serif;
    --background: oklch(0.968 0.012 95);
    --foreground: oklch(0.28 0.018 140);
    --primary: oklch(0.55 0.045 145);
    --primary-foreground: oklch(0.98 0.01 95);
    --muted-foreground: oklch(0.52 0.018 130);
    --border: oklch(0.88 0.016 110);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height: 100vh;
  }
  a{ color: inherit; }
  .container{
    max-width: 72rem; /* 1152px */
    margin: 0 auto;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  @media (min-width: 768px){
    .container{ padding: 40px 40px; }
  }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .brand{
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  .eyebrow{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--muted-foreground);
  }

  .hero{
    flex: 1;
    display: grid;
    gap: 48px;
    align-items: center;
    padding: 64px 0;
  }
  @media (min-width: 768px){
    .hero{ grid-template-columns: 1fr 1fr; gap: 64px; padding: 96px 0; }
  }

  .copy{ order: 2; }
  .art{ order: 1; }
  @media (min-width: 768px){
    .copy{ order: 1; }
    .art{ order: 2; }
  }

  h1{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0;
  }
  @media (min-width: 768px){ h1{ font-size: 60px; } }

  .sub{
    margin: 24px 0 0;
    max-width: 28rem;
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted-foreground);
  }

  form{
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 28rem;
  }
  @media (min-width: 640px){ form{ flex-direction: row; } }

  form input[type="email"]{
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    padding: 12px 4px;
    font-family: var(--font-sans);
    font-size: 16px;
    color: var(--foreground);
    outline: none;
    transition: border-color .15s ease;
    border-radius: 0;
  }
  form input[type="email"]::placeholder{ color: color-mix(in oklch, var(--muted-foreground) 70%, transparent); }
  form input[type="email"]:focus{ border-color: var(--primary); }

  form button{
    flex-shrink: 0;
    border: none;
    border-radius: var(--radius);
    background: var(--primary);
    color: var(--primary-foreground);
    padding: 12px 28px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  form button:hover{ opacity: 0.9; }

  .form-msg{
    margin: 16px 0 0;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .form-msg.success{ color: var(--foreground); }

  .art img{
    width: 100%;
    display: block;
    border-radius: var(--radius);
    object-fit: cover;
    box-shadow: 0 24px 60px -30px rgba(60,70,50,0.55);
  }

  footer{
    border-top: 1px solid var(--border);
    padding-top: 24px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  footer a{
    color: var(--foreground);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
</style>
</head>
<body>

  <div class="container">
    <header>
      <span class="brand">The Box</span>
      <span class="eyebrow">Coming soon</span>
    </header>

    <section class="hero">
      <div class="copy">
        <h1>Join the waitlist</h1>
        <p class="sub">We'll notify you the moment early units are available to order.</p>

        <form onsubmit="handleWaitlistSubmit(event)">
          <label for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">Email address</label>
          <input id="email" type="email" required placeholder="your@email.com" autocomplete="email">
          <button type="submit">Join the waitlist</button>
        </form>

        <p class="form-msg" id="form-msg" aria-live="polite">One email, at launch. Nothing before that.</p>
      </div>

      <div class="art">
        <img src="assets/hero-product.png" alt="The Box, a sage-green screen-free audio player, beside a tray of illustrated cards featuring Madicken, Ronja Rövardotter and Bröderna Lejonhjärta" loading="eager">
      </div>
    </section>

    <footer>
      For questions or partnerships, contact: <a href="mailto:hello@tunetap.to">hello@tunetap.to</a>
    </footer>
  </div>

<script>
  // NOTE: This form is front-end only. To actually collect signups, wire the
  // fetch() call below to an email service endpoint — e.g. a Mailchimp
  // audience signup URL, a Formspree/ConvertKit form endpoint, or a Google
  // Sheets webhook. Until that's connected, this only shows a local
  // confirmation message and does not store the email anywhere.
  function handleWaitlistSubmit(e){
    e.preventDefault();
    const form = e.target;
    const email = form.querySelector('input[type="email"]').value.trim();
    const msg = document.getElementById('form-msg');
    if (!email) return;

    // --- Replace this block with a real submission, e.g.: ---
    // fetch('YOUR_ENDPOINT_URL', {
    //   method: 'POST',
    //   headers: {'Content-Type':'application/json'},
    //   body: JSON.stringify({ email })
    // });

    msg.textContent = "Thank you — you're on the list.";
    msg.classList.add('success');
    form.reset();
  }
</script>

</body>
</html>
